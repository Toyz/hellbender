spec_version = 1

[project]
name        = "Hellbender"
slug        = "hellbender"
description = "Reverse engineering Hellbender (Microsoft / Terminal Reality, 1996) and porting it to Rust. No game data included."
repository  = "https://github.com/Toyz/hellbender"

[site]
base_url = "https://toyz.github.io/hellbender/"
readme   = "README.md"

[[link]]
label = "Repository"
url   = "https://github.com/Toyz/hellbender"
icon  = "github"

[docs]
dir   = "docs"
label = "Reference"

[index]
header = """
# Worklog

Running engineering log for the Hellbender reverse engineering and Rust port.
One file per entry under
[`worklog/`](worklog/), newest at the bottom. This index is generated by
`cairns index` - edit the entries, not this file.

Code says what; the worklog says *how we found out* and *why it is that way*.
"""

[[area]]
name  = "format"
about = "a container or record layout decoded"
[[area]]
name  = "decomp"
about = "facts pulled out of HELLBEND.EXE itself"
[[area]]
name  = "engine"
about = "game loop, entity model, simulation rules"
[[area]]
name  = "render"
about = "rasteriser, texturing, palettes, the sky"
[[area]]
name  = "world"
about = "terrain, levels, collision, missions"
[[area]]
name  = "flight"
about = "ship physics, controls, weapons"
[[area]]
name  = "audio"
about = "music, sound effects, the mixer"
[[area]]
name  = "video"
about = "Smacker cutscenes"
[[area]]
name  = "net"
about = "DirectPlay multiplayer"
[[area]]
name  = "ui"
about = "menus, HUD, cockpit, fonts"
[[area]]
name  = "content"
about = "what is in the PODs, inventories, counts"
[[area]]
name  = "port"
about = "Rust port architecture and progress"
[[area]]
name  = "tooling"
about = "the extractors and viewers under tools/"
[[area]]
name  = "build"
about = "cargo, layout, CI"
[[area]]
name  = "test"
about = "harnesses and fixtures"

[[publish]]
name = "site"
type = "dir"
path = "site/"
